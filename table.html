<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WHU Online · Herní stůl</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <small>WHU ONLINE</small>
      <h1>Herní stůl</h1>
    </div>
    <a class="button-link" href="index.html">← Zpět do lobby</a>
  </header>

  <main class="table-view-wrap">
    <section class="panel table-view">
      <div class="section-head">
        <div>
          <small>STŮL</small>
          <h2 id="tableTitle">Načítám stůl…</h2>
        </div>
        <span id="roleBadge" class="badge">Načítám roli…</span>
      </div>

      <div id="tableMessage" class="table-message">Připojuji k Firebase…</div>

      <div class="setup-grid compact-setup">
        <section class="setup-player-card" id="mySetupCard">
          <div class="setup-player-head">
            <div>
              <span id="myPlayerLabel" class="role-label">Můj výběr</span>
              <strong id="myName">—</strong>
            </div>
            <span id="myReadyBadge" class="ready-badge">Nepřipraven</span>
          </div>

          <div class="setup-field">
            <label for="myWarband">Warbanda</label>
            <input id="myWarband" list="warbandSuggestions" maxlength="80" placeholder="Např. Ironsoul’s Condemnors">
          </div>

          <div class="setup-field">
            <label for="myDeckUrl">Nemesis deck</label>
            <input id="myDeckUrl" type="url" placeholder="https://underworldsdb.com/...">
          </div>

          <div class="setup-field">
            <label for="myRivalsDecks">Rivals balíčky</label>
            <input id="myRivalsDecks" maxlength="100" placeholder="Např. Raging Slayers + Nexus of Power">
          </div>

          <div class="setup-actions compact-actions">
            <button id="mySave" type="button">Uložit výběr</button>
            <button id="myReady" class="primary" type="button">Jsem připraven</button>
            <button id="endTable" class="danger" type="button">Smazat stůl</button>
          </div>
        </section>

        <section class="setup-player-card opponent-card" id="opponentCard">
          <div class="setup-player-head">
            <div>
              <span class="role-label">Protihráč</span>
              <strong id="opponentName">—</strong>
            </div>
            <span id="opponentReadyBadge" class="ready-badge">Nepřipraven</span>
          </div>

          <dl class="opponent-summary">
            <div>
              <dt>Warbanda</dt>
              <dd id="opponentWarband">—</dd>
            </div>
            <div>
              <dt>Balíčky</dt>
              <dd id="opponentRivalsDecks">—</dd>
            </div>
          </dl>

          <p id="opponentStatus" class="opponent-status">Čekám na stav protihráče.</p>
        </section>
      </div>

      <datalist id="warbandSuggestions">
        <option value="Ironsoul’s Condemnors"></option>
        <option value="Sons of Velmorn"></option>
        <option value="The Emberwatch"></option>
      </datalist>

      <div class="game-start-row">
        <div id="gameStatus" class="game-status">Čekám, až budou připraveni oba hráči.</div>
        <button id="startGame" class="primary" type="button" hidden disabled>Spustit hru</button>
      </div>
    </section>
  </main>

  <script type="module" src="table.js"></script>
</body>
</html>
